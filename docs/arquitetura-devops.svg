<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316" />
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #374151; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box-text { font: 14px Arial, sans-serif; fill: #374151; }
      .small { font: 12px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 16; }
      .cloud { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 20; }
      .docker { fill: #ecfdf5; stroke: #16a34a; stroke-width: 3; rx: 20; }
      .volume { fill: #fff7ed; stroke: #f97316; stroke-width: 3; rx: 16; }
      .arrowBlue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #f97316; stroke-width: 4; fill: none; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="55" class="title">Arquitetura Macro DevOps - SpaceAgro API</text>
  <text x="60" y="82" class="subtitle">Global Solution 2026/1 - API .NET + PostgreSQL em containers Docker na nuvem</text>

  <rect x="70" y="140" width="180" height="105" class="box"/>
  <text x="112" y="178" class="box-title">Usuário</text>
  <text x="100" y="206" class="box-text">App / Browser</text>
  <text x="92" y="228" class="small">Acessa a API</text>

  <rect x="355" y="132" width="210" height="120" class="cloud"/>
  <text x="416" y="170" class="box-title">Internet</text>
  <text x="395" y="201" class="box-text">HTTP</text>
  <text x="395" y="223" class="small">Porta 8080</text>

  <rect x="685" y="105" width="430" height="560" class="cloud"/>
  <text x="810" y="143" class="box-title">VM em Nuvem / Azure</text>
  <text x="760" y="170" class="box-text">Docker Engine executando containers integrados</text>

  <rect x="725" y="205" width="350" height="385" class="docker"/>
  <text x="790" y="238" class="box-title">Docker Network</text>
  <text x="778" y="263" class="box-text">spaceagro-network-rm566462</text>

  <rect x="760" y="300" width="280" height="95" class="box"/>
  <text x="815" y="333" class="box-title">api-rm566462</text>
  <text x="796" y="360" class="box-text">API .NET 8 / ASP.NET Core</text>
  <text x="837" y="381" class="small">Porta 8080</text>

  <rect x="760" y="465" width="280" height="95" class="box"/>
  <text x="817" y="498" class="box-title">db-rm566462</text>
  <text x="810" y="525" class="box-text">PostgreSQL 16</text>
  <text x="837" y="546" class="small">Porta 5432</text>

  <rect x="770" y="635" width="260" height="70" class="volume"/>
  <text x="807" y="664" class="box-title">Volume nomeado</text>
  <text x="803" y="689" class="small">postgres-data-rm566462</text>

  <path d="M250 192 C295 192, 315 192, 355 192" class="arrowBlue"/>
  <path d="M565 192 C620 192, 640 347, 760 347" class="arrowBlue"/>
  <path d="M900 395 L900 465" class="arrowGreen"/>
  <path d="M900 560 L900 635" class="arrowOrange"/>

  <text x="275" y="176" class="small">Requisição HTTP</text>
  <text x="610" y="305" class="small">Acesso externo</text>
  <text x="920" y="430" class="small">Comunicação interna entre containers</text>
  <text x="920" y="610" class="small">Persistência dos dados</text>

  <rect x="70" y="510" width="500" height="155" class="box"/>
  <text x="95" y="545" class="box-title">Legenda</text>
  <line x1="95" y1="575" x2="165" y2="575" class="arrowBlue"/>
  <text x="185" y="580" class="box-text">Seta azul: requisições HTTP externas</text>
  <line x1="95" y1="610" x2="165" y2="610" class="arrowGreen"/>
  <text x="185" y="615" class="box-text">Seta verde: comunicação API ↔ banco na rede Docker</text>
  <line x1="95" y1="645" x2="165" y2="645" class="arrowOrange"/>
  <text x="185" y="650" class="box-text">Seta laranja: persistência em volume Docker</text>
</svg>
